name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lesson content
        run: npm run validate:content
      - name: Curriculum catalog
        run: npm run test:catalog
      - name: Curriculum refresh pipeline
        run: npm run test:refresh
      - name: Tutor brain (leak guard, hints, safety pause, red-team suite)
        run: npm run test:tutor
